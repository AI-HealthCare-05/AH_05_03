# ⚠ 2026-08-24 이후 기본 스택은 이 오버레이가 필요 없다.
#
# 프런트엔드가 FastAPI 안으로 들어갔다. `app/Dockerfile` 이 node 단계에서
# `frontend/dist` 를 빌드해 이미지에 굽고, `app/apis/spa.py` 가 정적 서빙과
# SPA 폴백을 맡는다. nginx 는 `/` 도 fastapi 로 프록시한다.
# 별도 프런트 컨테이너를 다시 띄우고 싶을 때만 이 파일을 쓴다.
#
# 이어봄 SPA 를 기존 스택에 얹는 오버레이.
#
# 왜 별도 파일인가
# ----------------
# 프런트엔드는 이 브랜치에 없다. `feature/health-record-registration` 에 있고,
# `git worktree add ../frontend-ref origin/feature/health-record-registration` 로
# 옆에 붙여 둔 사본을 빌드 컨텍스트로 쓴다. 브랜치가 합쳐지면 이 파일은 버리고
# 그쪽 docker-compose.yml 의 frontend 서비스를 그대로 쓰면 된다.
#
# docker-compose.override.yml 로 두지 않은 이유는 그 이름이 자동으로 병합돼서,
# 나중에 누가 `docker compose up` 만 쳤을 때 왜 프런트가 뜨는지 모르게 되기
# 때문이다. -f 로 명시해야 하는 이름을 골랐다.
#
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build

services:
  frontend:
    container_name: frontend
    build:
      # worktree 루트. Dockerfile 이 `COPY frontend/package.json` 를 하므로
      # 컨텍스트는 frontend/ 의 부모여야 한다.
      context: ../frontend-ref
      additional_contexts:
        # 로컬 보안 소프트웨어(Norton 등)의 TLS 가로채기용 루트 인증서.
        # app/Dockerfile 은 이미 같은 걸 하는데 frontend/Dockerfile 에는 그 단계가
        # 없어서, 이 PC 에서는 npm ci 가 UNABLE_TO_VERIFY_LEAF_SIGNATURE 로 죽는다
        # (npm 은 그 오류를 "Exit handler never called!" 로 감춘다).
        # 인증서가 없는 팀원 환경에서는 빈 디렉터리가 복사되고 아무 일도 없다.
        certs: ./docker/certs
      dockerfile_inline: |
        FROM node:22-alpine AS build
        # 신뢰 저장소를 갱신하지 않고 NODE_EXTRA_CA_CERTS 로 얹는다. alpine 에서
        # update-ca-certificates 를 쓰려면 apk 로 패키지를 받아야 하는데, 그
        # apk 자체가 같은 TLS 를 타서 닭과 달걀이 된다.
        COPY --from=certs . /usr/local/share/ca-certificates/
        RUN cat /usr/local/share/ca-certificates/*.crt > /extra-ca.pem 2>/dev/null || : > /extra-ca.pem
        ENV NODE_EXTRA_CA_CERTS=/extra-ca.pem

        WORKDIR /frontend
        COPY frontend/package.json frontend/package-lock.json ./
        RUN npm ci
        COPY frontend/ ./
        # `npm run build` 는 `tsc -b && vite build` 다. 지금
        # feature/health-record-registration HEAD 에 타입 오류가 하나 있어서
        # (HealthRecordWorkspace.tsx:166 `result.examItems` possibly undefined)
        # tsc 에서 멈춘다. 남의 브랜치 소스를 여기서 고치지 않는다 — 화면을
        # 띄워 보는 게 목적이므로 번들만 만들고, 타입 오류는 그쪽에서 고친다.
        # 그 커밋이 들어오면 이 줄을 `npm run build` 로 되돌린다.
        RUN npx vite build

        FROM nginx:alpine
        COPY frontend/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /frontend/dist /usr/share/nginx/html
        EXPOSE 80
        HEALTHCHECK --interval=10s --timeout=3s --retries=3 \
          CMD wget -q -O - http://127.0.0.1/healthz || exit 1
    image: ieobom-frontend:local
    restart: always
    networks:
      - ws

  nginx:
    # 기본 conf 는 `location /` 에서 404 를 돌려준다 (프런트 없는 구성).
    # 프런트를 띄울 때만 이 사본으로 갈아 끼운다.
    volumes:
      - ./infra/nginx/default.with-frontend.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
    depends_on:
      - fastapi
      - frontend
