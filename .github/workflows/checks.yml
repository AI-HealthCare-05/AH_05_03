name: ci.yml

on:
  push:
    branches:
      - main
      - dev
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치는 보통 develop으로 PR을 생성하기 때문에 develop이 target 브랜치에 포함되어 있다면 별도로 적지 않아도 됩니다.
    branches:
      - main
      - dev
      - develop
      - 'release/*'
      - 'hotfix/*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# uv는 .python-version(3.10)을 우선하므로, setup-python이 3.13을 깔아도
# 조용히 3.10 환경이 만들어진다. 배포 이미지가 python:3.13-slim이라
# CI도 3.13을 쓰도록 명시한다.
env:
  UV_PYTHON: '3.13'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend type check
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify local model network boundary
        run: npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ai_health
        ports:
          - 5432:5432
        # 기존 mysql 서비스에는 healthcheck가 아예 없어서 test job이
        # 컨테이너 기동과 경쟁하고 있었다.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # .env는 git 제외라 CI에는 없다. 지금까지는 Config 기본값이
      # 우연히 mysql과 맞아떨어졌을 뿐이므로 명시한다.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pw1234
      DB_NAME: ai_health
      DB_TEST_NAME: ai_health_test
      SECRET_KEY: ci-secret-key
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ "$(find . -name "test_*.py" | wc -l)" -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify no model/migration drift
        # 테스트는 create_all로 스키마를 만들기 때문에, 모델과 마이그레이션이
        # 어긋나는 것을 잡는 장치는 이 단계가 유일하다.
        run: uv run alembic check

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          uv run coverage run -m pytest app
          uv run coverage report -m

  deploy-dev-admin-mac:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - frontend
      - lint
      - test
    runs-on:
      - self-hosted
      - macOS
      - ieobom-admin
    environment: admin-macbook-dev
    timeout-minutes: 45
    env:
      IEOBOM_ENV_FILE: ${{ vars.IEOBOM_DEV_ENV_FILE }}
      IEOBOM_HTTP_PORT: ${{ vars.IEOBOM_DEV_HTTP_PORT }}
      IEOBOM_DEV_TAILSCALE_HOST: ${{ vars.IEOBOM_DEV_TAILSCALE_HOST }}
      IEOBOM_DEV_INVITATION_WEB_ORIGIN: ${{ vars.IEOBOM_DEV_INVITATION_WEB_ORIGIN }}
      IEOBOM_DEV_CORS_ALLOW_ORIGINS: ${{ vars.IEOBOM_DEV_CORS_ALLOW_ORIGINS }}
      IEOBOM_DEV_REFRESH_COOKIE_SECURE: ${{ vars.IEOBOM_DEV_REFRESH_COOKIE_SECURE }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact dev revision that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${DEPLOY_SHA}" ]]; then
            echo "Expected ${DEPLOY_SHA}, checked out ${checked_out_sha}" >&2
            exit 1
          fi
          echo "Deploying ${checked_out_sha}"

      - name: Locate Docker Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            exit 0
          fi
          docker_cli_dir="/Applications/Docker.app/Contents/Resources/bin"
          if [[ ! -x "${docker_cli_dir}/docker" ]]; then
            echo "Docker Desktop CLI was not found at ${docker_cli_dir}." >&2
            exit 1
          fi
          echo "${docker_cli_dir}" >> "$GITHUB_PATH"

      - name: Deploy dev stack
        shell: bash
        timeout-minutes: 10
        run: ./scripts/deploy_admin_mac.sh

      - name: Show service logs after a failed deployment
        if: failure()
        shell: bash
        run: |
          env_file="${IEOBOM_ENV_FILE:-$HOME/.config/ieobom/dev.env}"
          docker compose \
            --project-name ieobom-dev \
            --env-file "${env_file}" \
            --file infra/docker/docker-compose.dev-mac.yml \
            ps || true
          docker compose \
            --project-name ieobom-dev \
            --env-file "${env_file}" \
            --file infra/docker/docker-compose.dev-mac.yml \
            logs --tail 200 fastapi frontend nginx migrate mailpit email-worker || true
