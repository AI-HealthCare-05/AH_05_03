services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    # **빠져 있었다.** 데몬 재시작이나 OOM 뒤에 이 컨테이너만 안 올라오면 fastapi 는
    # 뜬 채로 큐·속도 제한·리프레시 토큰 저장이 전부 죽는다.
    restart: always
    networks:
      - ws
    ports:
      # **루프백에만 묶는다.** `0.0.0.0` 으로 열려 있었다 — 인증 없는 Redis 가 공인
      # IP 에 그대로 노출된 상태였고, 여기엔 리프레시 토큰과 초대 원문 토큰이 있다.
      # 컨테이너끼리는 `ws` 네트워크로 통하므로 이 포트는 서버 안 디버깅 전용이다.
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
    # POSTGRES_USER가 클러스터 슈퍼유저다. 별도 root 계정이 없다.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 루프백에만 묶는다. Redis 와 같은 이유다 — `0.0.0.0` 이면 계정·구독·가구
      # 테이블이 통째로 공인 IP 에 붙는다. 서버 안에서 psql 로 붙는 용도만 남긴다.
      - "127.0.0.1:${DB_EXPOSE_PORT}:5432"
    networks:
      - ws
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2-1. 마이그레이션 (일회성)
  #      이미지 CMD에 넣으면 워커 3개가 alembic_version 행을 두고 경쟁한다.
  migrate:
    container_name: migrate
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    # 런타임 이미지에 uv 가 없다 (`app/Dockerfile` 멀티스테이지). venv 가 PATH 앞에
    # 있으므로 `alembic` 을 그냥 부른다. `uv run` 이면 "executable file not found".
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    networks:
      - ws
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
      # 위험도 모델 번들. 이미지에 없고(`app/Dockerfile` 은 규칙 엔진만 COPY 한다)
      # `app/services/risk.py` 가 `/app/models` 를 본다. 빠지면 규칙 엔진만 살아남고
      # ML 판정이 "위험도 모델이 적재되지 않았습니다" 로 죽는다.
      - ../../modeling/artifacts/models:/app/models:ro
    restart: always
    ports:
      # nginx 는 `ws` 네트워크로 `fastapi:8000` 에 붙으므로 이 포트는 필요 없다.
      # `0.0.0.0:8000` 으로 열려 있었는데, 그러면 nginx 를 건너뛰는 통로가 생겨
      # job_id 접근로그 마스킹과 `client_max_body_size 64m` 이 둘 다 무력해진다.
      # 서버 안 디버깅용으로만 루프백에 남긴다.
      - "127.0.0.1:8000:8000"
    networks:
      - ws
    # **"떴다"와 "요청을 처리할 수 있다"는 다르다.** 이게 없어서 번들 볼륨이 안 붙은
    # 컨테이너가 healthy 로 보였고, nginx 는 트래픽을 넘겼고, 사용자는 예측마다
    # 503 "위험도 모델이 적재되지 않았습니다" 를 봤다. 2026-09-04 배포가 그 상태였다
    # (`/api/health` 가 `models:false, targets:0`). `/api/health` 는 Redis 가 죽어도
    # 200 을 주도록 설계돼 있으므로, 상태 코드만 보면 이 경우를 못 걸러낸다.
    # **`models` 를 직접 본다.**
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3) as r:
              sys.exit(0 if r.status == 200 and json.load(r)["models"] else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 4. AI Worker (연구·비건강 비동기 작업 전용)
  #    브라우저의 건강정보 또는 건강 모델 입출력을 전달하지 않는다.
  ai-worker:
    # **`container_name` 을 두면 안 된다.** 이름이 고정된 서비스는 compose 가 여러 벌
    # 띄우지 못해 아래 `replicas` 가 조용히 무시된다.
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    # 로컬과 같은 3 대. 1 대로 떠 있었다 — 소비 동시성이 곧 워커 수라, 문서 인식
    # 한 건이 3~6 초를 먹는 동안 뒤에 선 사람이 그만큼씩 밀린다.
    deploy:
      replicas: 3
    # **빠져 있었다.** fastapi 와 같은 번들 파일을 봐야 동기 경로와 큐 경로의 판정이
    # 갈리지 않는다. 이게 없으면 이 워커의 예측은 전부 "모델 미적재" 로 죽는다.
    volumes:
      - ../../modeling/artifacts/models:/app/models:ro
      - ../../chronic_disease_engine:/app/chronic_disease_engine:ro
    restart: always
    # 3 대 x 4G 는 과하다. 순수 파이썬 채점이고 상한은 번들 20 개를 메모리에 들고
    # 있는 크기(원본 24MB)가 지배한다 — 로컬 실측과 같은 근거다.
    mem_limit: 1G
    # "떠 있음"과 "큐를 소비 중"은 다르다. 소비자 그룹 등록과 모델 적재를 같이 본다.
    healthcheck:
      test: ["CMD", "python", "-m", "ai_worker.healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. 초대 메일 워커 (계정·초대 메타데이터 전용)
  #
  #    **이 서비스가 통째로 빠져 있었다.** 초대 API 는 201 "초대 전송을 예약했습니다"
  #    를 돌려주고 Redis Stream 에 넣기만 하는데, 운영에는 그걸 꺼내 갈 소비자가
  #    아무도 없었다. 메일은 영영 안 나가고 오류도 안 남는다 — 초대한 사람과 받을
  #    사람 양쪽 다 무엇이 잘못됐는지 알 방법이 없는 조합이다.
  #
  #    SMTP 값은 `.env` 에서 온다(`SMTP_HOST`·`SMTP_PORT`·`SMTP_USERNAME` 등).
  #    로컬의 mailpit 은 개발 전용이라 여기 없다.
  email-worker:
    container_name: email-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    command: ["python", "-m", "app.workers.invitation_email_worker"]
    env_file: .env
    restart: always
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 6. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    # **재시작 정책이 빠져 있었다.** 설정 오류나 OOM 으로 한 번 죽으면 사이트가
    # 통째로 내려간 채 아무도 안 살린다.
    restart: always
    volumes:
      # **경로가 틀려 있었다.** compose 의 상대경로는 이 파일이 있는 폴더
      # (`infra/docker/`) 기준이라 `./nginx/...` 는 `infra/docker/nginx/` 를 가리키는데
      # 그런 폴더는 없다. 실제 설정은 한 단계 위 `infra/nginx/` 에 있다. 없는 경로를
      # 마운트하면 도커가 빈 **디렉터리**를 만들어 붙여서 nginx 가 설정을 못 읽는다.
      #
      # 인증서를 아직 못 받은 첫 배포에서는 `prod_http.conf` 로 한 번 띄워
      # certbot 을 통과시킨 뒤 이 줄로 되돌린다 — `prod_https.conf` 는 인증서 파일이
      # 없으면 nginx 가 기동 자체를 못 한다.
      - ../nginx/prod_https.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    # **`condition` 이 없었다.** 그냥 `- fastapi` 면 컨테이너가 "시작됐다"만 보고
    # 문을 열어, 부팅 직후 들어온 요청이 502 를 맞는다. 위 healthcheck 와 짝이다 —
    # 모델이 안 붙은 컨테이너에는 트래픽이 아예 안 간다.
    depends_on:
      fastapi:
        condition: service_healthy

  # 7. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
    name: postgres_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
