services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 기본값은 admin Mac 자신만 접근한다. 팀 공유가 필요할 때만 dev.env의
    # DEV_DB_BIND_HOST를 이 Mac의 Tailscale IPv4로 지정한다. 0.0.0.0 금지.
    ports:
      - "${DEV_DB_BIND_HOST:-127.0.0.1}:${DEV_DB_PORT:-15432}:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 개발용 초대 메일 수신함. Web UI만 명시한 Tailscale 인터페이스에
  # 공개할 수 있으며 SMTP 포트는 호스트에 노출하지 않는다.
  mailpit:
    # Mailpit 공식 릴리스는 Docker Hub와 GHCR에 같은 이미지를 게시한다.
    # admin Mac에서 Docker Hub credential helper가 멈춘 이력이 있어 GHCR을 사용하고
    # 다중 아키텍처 index digest까지 고정한다. 배포 스크립트가 빈 Docker config로
    # 먼저 익명 pull하므로 Compose는 자격증명 도우미를 다시 호출하지 않는다.
    image: ${MAILPIT_IMAGE:-ghcr.io/axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${DEV_MAILPIT_BIND_HOST:-127.0.0.1}:${DEV_MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - app

  migrate:
    image: ieobom-dev-fastapi:current
    # 런타임 이미지에는 uv 가 없다. `app/Dockerfile` 이 멀티스테이지가 되면서
    # uv 는 deps 스테이지에만 살고, venv 가 PATH 앞에 있어 `alembic` 을 그냥 부른다.
    # `uv run` 을 남겨 두면 "executable file not found" 로 죽고, 배포 스크립트가
    # `set -Eeuo pipefail` 이라 그 줄에서 배포 전체가 멈춘다.
    command: ["alembic", "upgrade", "head"]
    environment: &app_environment
      ENV: dev
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_TEST_NAME: ${DB_TEST_NAME:-ai_health_test}
      REDIS_URL: redis://redis:6379/0
      ENABLE_DEV_OCR_BRIDGE: ${ENABLE_DEV_OCR_BRIDGE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      # 건강 비서·날씨·식품·의약품·병원 검색용 외부 API 키
      KMA_API_KEY: ${KMA_API_KEY:-}
      AIRKOREA_API_KEY: ${AIRKOREA_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
      FOOD_NUTRITION_API_KEY: ${FOOD_NUTRITION_API_KEY:-}
      EMERGENCY_MEDICAL_API_KEY: ${EMERGENCY_MEDICAL_API_KEY:-}
      HOSPITAL_INFO_API_KEY: ${HOSPITAL_INFO_API_KEY:-}
      PHARMACY_INFO_API_KEY: ${PHARMACY_INFO_API_KEY:-}
      KDCA_DISEASE_INFO_API_KEY: ${KDCA_DISEASE_INFO_API_KEY:-}
      KDCA_HEALTH_INFO_API_KEY: ${KDCA_HEALTH_INFO_API_KEY:-}
      # dev 배포에는 Gemini 키만 필수 주입된다. 앱 기본값(openai 단독)에 맡기면 쓸 수 있는
      # 공급자가 0개가 되므로, 배포에서 실제로 제공하는 공급자를 명시한다.
      DEV_OCR_MODELS: ${DEV_OCR_MODELS:-["gemini-3.5-flash-lite","gemini-3.1-flash-lite"]}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["https://ieobom.cromtind.uk","http://localhost:8080"]}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ieobom_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      API_ERROR_INCLUDE_DETAILS: ${API_ERROR_INCLUDE_DETAILS:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@ieobom.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-이어봄}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  fastapi:
    image: ieobom-dev-fastapi:current
    build:
      context: ../..
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment: *app_environment
    # 위험도 모델은 순수 JSON이라 이미지에 넣지 않고 마운트한다 (`app/Dockerfile` 은
    # 규칙 엔진만 COPY 한다). **이 줄이 없으면 규칙 엔진만 살아 있고 ML 판정이 통째로
    # 죽는다** — `RiskModelRegistry._resolve` 가 `/app/models` 도 저장소 폴백
    # `/app/modeling/artifacts/models` 도 못 찾아 `available=False` 가 되고, 화면에는
    # "위험도 모델이 적재되지 않았습니다" 만 뜬다. 실제로 그 상태로 배포돼 있었다.
    # 경로는 이 파일 기준 상대경로다 (compose 는 compose 파일 위치를 기준으로 푼다).
    volumes:
      - ../../modeling/artifacts/models:/app/models:ro
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # **`/api/openapi.json` 이 아니라 `/api/health` 다.** 전자는 모델이 하나도 안
    # 실려도 200 이라, 위 마운트가 빠진 것을 배포 게이트가 못 잡았다. 후자는
    # `models` 로 적재 여부를 드러내므로 그 값까지 본다 — 볼륨이 안 붙으면 컨테이너가
    # healthy 가 되지 않고, nginx 가 뜨지 않아 배포가 그 자리에서 실패한다.
    # 조용히 반쪽짜리로 도는 것보다 배포가 큰 소리로 죽는 쪽이 싸다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['models'] else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # 문서 인식 화면은 Redis 큐에 작업을 등록한다. 이 소비자가 없으면 작업이 queued인
  # 채로 TTL까지 남으므로, OCR 브리지를 켜는 dev 배포에서는 선택 서비스가 아니다.
  ai-worker:
    image: ieobom-dev-ai-worker:current
    build:
      context: ../..
      dockerfile: ai_worker/Dockerfile
    command: ["python", "-m", "ai_worker.main"]
    restart: unless-stopped
    deploy:
      replicas: 3
    environment: *app_environment
    volumes:
      - ../../modeling/artifacts/models:/app/models:ro
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "ai_worker.healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  email-worker:
    image: ieobom-dev-fastapi:current
    command: ["python", "-m", "app.workers.invitation_email_worker"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@ieobom.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-이어봄}
      SMTP_USE_TLS: "false"
      SMTP_USE_STARTTLS: "false"
      INVITATION_WEB_ORIGIN: ${INVITATION_WEB_ORIGIN:-http://127.0.0.1:8080}
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  anatomy-assets:
    image: ieobom-dev-anatomy-assets:current
    build:
      context: ../../frontend/public/vendor/vanatome
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/vendor/vanatome/ATTRIBUTION.txt"]
      interval: 10s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
    networks:
      - app
    depends_on:
      fastapi:
        condition: service_healthy
      anatomy-assets:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
