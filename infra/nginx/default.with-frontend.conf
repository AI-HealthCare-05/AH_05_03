upstream fastapi {
    server fastapi:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    server_name _;

    listen 80;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # /api/ 가 / 보다 긴 접두사라 먼저 걸린다. Swagger 와 /api/demo 는 그대로 FastAPI 로 간다.
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 나머지는 이어봄 SPA. 기본 default.conf 는 여기서 404 를 돌려주는데,
    # 그 파일은 프런트가 없는 구성이라 그렇다. 이 사본은 프런트를 함께
    # 띄울 때만 쓰고, 원본은 건드리지 않는다 (docker-compose.frontend.yml 참조).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
