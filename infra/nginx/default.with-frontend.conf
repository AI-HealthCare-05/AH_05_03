# 작업 id 를 접근 로그에서 가린다. 근거와 실측은 `default.conf` 상단 주석 참조 —
# `job_id` 는 소유권 검사를 대신하는 자격증명이라 평문으로 남으면 안 된다.
map $request_uri $masked_uri {
    "~^(?<prefix>/api/v1/(?:predictions|dev/ocr)/jobs/)[A-Za-z0-9_-]{8,}(?<suffix>.*)$" "${prefix}***${suffix}";
    default $request_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream fastapi {
    server fastapi:8000;

    # `proxy_http_version 1.1` + `Connection ""` 와 짝이다. 빠뜨리면 큰 응답이
    # 간헐적으로 끊긴다 — 자세한 근거는 `default.conf` 의 같은 블록 참조.
    keepalive 32;
}

upstream frontend {
    server frontend:80;
}

server {
    server_name _;

    listen 80;

    # 마스킹된 접근 로그. server 레벨이어야 상위 기본값을 덮어쓴다.
    access_log /var/log/nginx/access.log masked;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # /api/ 가 / 보다 긴 접두사라 먼저 걸린다. Swagger 와 /api/demo 는 그대로 FastAPI 로 간다.
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 없으면 nginx 기본값 1m 이 걸려 문서 인식 업로드가 앱 검증에 닿기도 전에
        # 413 이 된다. `default.conf` 와 같은 값을 쓴다.
        client_max_body_size 64m;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 나머지는 이어봄 SPA. 기본 default.conf 는 여기서 404 를 돌려주는데,
    # 그 파일은 프런트가 없는 구성이라 그렇다. 이 사본은 프런트를 함께
    # 띄울 때만 쓰고, 원본은 건드리지 않는다 (docker-compose.frontend.yml 참조).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
