# 앞단이 이미 알려 준 프로토콜을 잇는다.
#
# **`$scheme` 을 그대로 넘기면 안 된다.** Cloudflare 터널은 이 nginx 에
# `http://127.0.0.1:8080` 으로 붙는다(`scripts/configure_admin_cloudflare_tunnel.sh`).
# 그래서 여기 `$scheme` 은 브라우저가 https 로 왔어도 `http` 다. 그 값으로
# X-Forwarded-Proto 를 덮어쓰면 앞단이 보낸 `https` 가 지워지고, 앱은 요청이 어느
# 주소로 왔는지 영영 알 수 없다. 그러면 같은 출처 판정도 초대 메일 링크 주소도
# 어긋난다. 2026-09-04 에 이 덮어쓰기를 재현해 로그인 403 을 확인했다.
#
# 앞단이 아무것도 안 보내면(직접 접속) `$scheme` 으로 되돌아간다.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~^(https|http)$" $http_x_forwarded_proto;
}

# 작업 id 를 접근 로그에서 가린다.
#
# **`job_id` 는 식별자가 아니라 자격증명이다.** 예측·문서 인식 작업 조회는 소유권을
# 검사하지 않는다 — 작업 해시에 계정 식별자를 넣지 않기로 했고(ADR-010 §6), 대신
# 128 비트 난수를 아는 것 자체를 접근 자격으로 삼는다(`prediction_job_routers.py` 주석).
#
# 그 전제가 로그로 깨져 있었다. 2026-08-27 실측 — nginx 접근 로그에 job_id 가
# **1110 건** 평문으로 남아 있었다. 로그를 볼 수 있는 사람은 TTL(예측 600초·인식
# 300초) 동안 남의 건강 판정을 그대로 다시 받아올 수 있다. 로그 수집기·지원 스크린샷·
# 백업까지 따라가는 값이라 수명은 TTL 보다 훨씬 길다.
#
# 경로 구조는 남기고 id 만 가린다 — `/api/v1/predictions/jobs/***` 로 찍히므로
# 어느 엔드포인트가 몇 번 불렸는지는 그대로 보인다.
map $request_uri $masked_uri {
    "~^(?<prefix>/api/v1/(?:predictions|dev/ocr)/jobs/)[A-Za-z0-9_-]{8,}(?<suffix>.*)$" "${prefix}***${suffix}";
    default $request_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream fastapi {
    server fastapi:8000;

    # **`proxy_http_version 1.1` + `Connection ""` 와 반드시 짝이다.**
    # SSE 를 위해 아래 `location /api/` 에서 그 둘을 켰는데 이 줄을 빠뜨렸더니
    # 큰 응답이 간헐적으로 끊겼다 — `/api/demo`(65KB) 를 96회 두드려 3회
    # `ConnectionResetError`. 서버 로그에는 200 으로 남아 있어서 앱을 봐서는 안 보인다.
    #
    # 이유는 이렇다. 위 둘만 켜면 nginx 는 업스트림에 `Connection: close` 를 보내지
    # 않으면서도 **연결을 재사용할 풀이 없어** 매번 새로 열고 닫는다. 그 사이에
    # 끊기는 창이 생긴다. `keepalive` 가 있어야 nginx 가 유휴 연결을 제대로 들고 있는다.
    keepalive 32;
}

upstream anatomy_assets {
    server anatomy-assets:80;
    keepalive 8;
}

server {
    server_name _;

    listen 80;
    client_max_body_size 25M;

    # **`server` 블록 안이어야 한다.** http 컨텍스트에 두면 베이스 `nginx.conf` 의
    # 기본 `access_log ... main` 을 덮는 게 아니라 **한 줄 더 추가**한다 — 실제로
    # 마스킹된 줄과 평문 줄이 나란히 찍혔다. server 레벨은 상위를 덮어쓴다.
    access_log /var/log/nginx/access.log masked;

    # 압축. 프런트 컨테이너를 없애면서 `frontend/nginx.conf` 의 보안 헤더·캐시·SPA
    # 폴백은 `app/apis/spa.py` 로 옮겼는데 **gzip 만 옮겨지지 않아 유실됐다.**
    #
    # `gzip_proxied any` 가 필요하다 — 이 서버는 모든 응답을 업스트림에서 받아 오고,
    # nginx 는 기본값(`off`)에서 프록시 응답을 압축하지 않는다. 이걸 빼면 켜도 안 먹는다.
    #
    # `proxy_buffering off` 인 `/api/` 도 압축된다. nginx 는 버퍼링과 무관하게
    # 흐르는 중에 압축할 수 있다 — 처음에 안 그럴 것이라 적었다가 실측으로 확인했다.
    #
    # 실측 (2026-08-25):
    #   판정 응답            28,274 B ->  6,503 B  (4.3배)
    #   openapi.json        131,871 B -> 17,964 B  (7.3배)
    #   index-*.js          453,250 B -> 132,962 B (3.4배)
    #   VanatomeBodyMap.js  635,399 B -> 161,217 B (3.9배)
    #
    # CSS 678 B 는 `gzip_min_length 1024` 아래라 압축하지 않는다 — 작은 파일은
    # 압축 헤더가 이득보다 크다.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # **`text/javascript` 가 목록에 있어야 한다.** FastAPI 의 `FileResponse` 가 `.js` 를
    # `text/javascript; charset=utf-8` 로 내는데, 흔히 쓰는 `application/javascript` 만
    # 적으면 정작 제일 큰 파일이 압축되지 않는다. 실제로 그렇게 빠뜨렸다가
    # 453,250 B 가 그대로 나가는 것을 확인하고 고쳤다.
    # `text/html` 은 nginx 가 `gzip_types` 와 무관하게 항상 압축한다.
    gzip_types application/json text/javascript application/javascript text/css text/plain image/svg+xml application/octet-stream model/gltf-binary;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;

        # **이 줄이 없으면 nginx 기본값 1m 이 걸린다.** 앱은 문서 인식 업로드를
        # 파일당 20MB(`DEV_OCR_MAX_FILE_BYTES`)·합계 30MB(`DEV_OCR_JOB_MAX_TOTAL_BYTES`)
        # 까지 받겠다고 선언하는데, 그 검증 코드에 도달하지도 못하고 nginx 가 413 으로
        # 끊었다. 휴대폰으로 찍은 검진표는 대개 1MB 를 넘으므로 주 사용 경로가 막혀 있었다.
        #
        # **앱 상한보다 넉넉히 크게 잡는다.** 32m 은 앱의 30MB 와 너무 붙어 있어서
        # multipart 경계·헤더·파일명이 길어지면 경계에서 다시 nginx 가 끊는다. 그때
        # 사용자가 받는 것은 우리 오류 봉투가 아니라 nginx 의 HTML 413 이고, 프런트의
        # 공통 오류 처리가 그걸 파싱하지 못해 "알 수 없는 오류" 로 보인다.
        # **어느 요청을 거절할지는 앱이 정해야 하고 nginx 는 통과만 시켜야 한다.**
        client_max_body_size 64m;

        # 네 설정 파일이 모두 이 값을 쓴다. 뒤집으면 gzip 이 걸리지만 SSE 가 막힌다 —
        # 위 gzip 블록의 설명 참조. 지금은 기존 선택을 유지한다.
        proxy_buffering off;

        # 문서 인식 SSE(`/dev/ocr/jobs/{id}/stream`)는 워커가 Gemini 청크를 받아
        # Redis 로 흘리는 동안 열려 있다. 기본 60 초면 인식이 끝나기 전에 nginx 가
        # 끊어 프런트가 재연결을 반복한다.
        proxy_read_timeout 300s;

        # SSE 는 HTTP/1.1 청크 전송이 필요하다. nginx 는 업스트림에 기본으로 1.0 을
        # 쓰므로 명시해야 한다. `Connection ""` 는 그 짝이다 — 안 지우면 nginx 가
        # `Connection: close` 를 붙여 매 응답마다 업스트림 연결이 닫힌다.
        # **둘을 켜면 위 upstream 블록의 `keepalive` 도 있어야 한다.** 셋이 한 벌이다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 큰 GLB/메타데이터는 앱 이미지와 독립적으로 버전 관리한다. 프런트나 API만
    # 바뀐 배포에서는 이 서비스와 자산 레이어를 다시 만들지 않는다.
    location /vendor/vanatome/ {
        proxy_pass http://anatomy_assets;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering on;
    }

    # 프런트엔드도 FastAPI 가 서빙한다. 별도 nginx 컨테이너를 없애면서
    # `frontend/nginx.conf` 의 보안 헤더·캐시·SPA 폴백은 `app/apis/spa.py` 로 옮겼다.
    location / {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
