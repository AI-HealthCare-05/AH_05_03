# 앞단이 이미 알려 준 프로토콜을 잇는다.
#
# **`$scheme` 을 그대로 넘기면 안 된다.** Cloudflare 나 터널이 TLS 를 끊고 평문으로
# 이 nginx 에 넘기는 배포에서는 `$scheme` 이 `http` 다. 그 값으로 X-Forwarded-Proto 를
# 덮어쓰면 앞단이 보낸 `https` 가 지워지고, 앱은 브라우저가 https 로 왔다는 사실을
# 영영 모른다. 그러면 같은 출처 판정도, 초대 메일 링크의 주소도 http 로 어긋난다.
# 2026-09-04 에 이 덮어쓰기를 재현해 로그인 403 을 확인했다.
#
# 앞단이 아무것도 안 보내면(직접 접속) `$scheme` 으로 되돌아간다.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~^(https|http)$" $http_x_forwarded_proto;
}

# 작업 id 를 접근 로그에서 가린다. 근거와 실측은 `default.conf` 상단 주석 참조 —
# `job_id` 는 소유권 검사를 대신하는 자격증명이라 평문으로 남으면 안 된다.
map $request_uri $masked_uri {
    "~^(?<prefix>/api/v1/(?:predictions|dev/ocr)/jobs/)[A-Za-z0-9_-]{8,}(?<suffix>.*)$" "${prefix}***${suffix}";
    default $request_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream fastapi {
    server fastapi:8000;

    # `proxy_http_version 1.1` + `Connection ""` 와 짝이다. 빠뜨리면 큰 응답이
    # 간헐적으로 끊긴다 — 자세한 근거는 `default.conf` 의 같은 블록 참조.
    keepalive 32;
}

server {
    server_name 도메인 혹은 EC2_IP;

    listen 80;

    # 마스킹된 접근 로그. server 레벨이어야 상위 기본값을 덮어쓴다.
    access_log /var/log/nginx/access.log masked;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;

        # 없으면 nginx 기본값 1m 이 걸려 문서 인식 업로드가 앱 검증에 닿기도 전에
        # 413 이 된다. `default.conf` 와 같은 값을 쓴다 — 어긋나면 로컬에서 되던 것이
        # 배포에서만 깨진다. 어느 요청을 거절할지는 앱이 정하고 nginx 는 통과만 시킨다.
        client_max_body_size 64m;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 프런트엔드도 FastAPI 가 서빙한다(`app/apis/spa.py`). 별도 nginx 컨테이너를
    # 없앨 때 `default.conf` 만 고치고 이 파일은 `return 404` 로 남아 있었다 —
    # 그대로 배포하면 `/api/` 만 살아 있고 사이트 첫 화면부터 404 다.
    location / {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
