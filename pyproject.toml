[project]
name = "ieobom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
# **여기 있는 것은 전부 런타임 이미지에 들어간다.** `[project] dependencies` 는
# `--no-dev` 로도 못 빼기 때문이다. 그래서 서빙이 실제로 import 하는 것만 남긴다.
#
# 예전에는 모델링·노트북 스택이 여기 섞여 있었고, `export_model.py` 주석이
# "API 이미지가 sklearn·numpy·pandas 를 끌고 오면 안 된다" 고 적어 둔 그대로를
# 어기고 있었다. 2026-08-27 실측 — 런타임 venv 1.1GB 중
#   nvidia 288M(xgboost 가 끌어오는 CUDA NCCL) · xgboost 84M · scipy 81M ·
#   duckdb 58M · pandas 42M · jedi 33M(jupyter) · babel 33M · sklearn 32M ·
#   matplotlib 25M
# 이 전부 서빙이 한 번도 import 하지 않는 것이었다.
#
# 추가하기 전에 물어라 — **이걸 서빙 컨테이너가 import 하는가.** 아니면 아래
# `modeling` 으로.
dependencies = [
    # PyJWT 가 알고리즘 검사에서 본다 (`app/core/jwt/backends.py`).
    "cryptography>=46.0.3",
    "google-genai>=2.19.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "redis>=7.1.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
ai = [
    "torch",
    "torchvision",
    "torchaudio",
    "sentence-transformers>=5.2.0",
]
# 학습·분석·노트북 전용. **서빙 이미지에는 들어가지 않는다** — 번들은 순수 JSON 이고
# 채점은 부등호 비교뿐이라 런타임 의존이 없다(`export_multi.py` 참조).
# `dev` 가 이 그룹을 품으므로 CI(`uv sync`, `uv sync --group app`)와 로컬 개발은
# 그대로 다 받는다. 도커만 `--no-dev` 로 빠진다.
modeling = [
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tomlkit>=0.14.0",
    "xgboost>=3.0",
]
app = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt<=4.0.1",
    # **`[standard]` 를 쓰지 않는다.** 그 extra 는 `fastapi-cli[standard]` 를 거쳐
    # `fastapi-cloud-cli` 를 끌고 오고, 거기 딸린 것이 sentry-sdk(6MB) · pygments(10MB) ·
    # rich-toolkit · rignore(3MB) · typer · fastar 다. 전부 FastAPI Cloud 배포 CLI 용이고
    # 이 저장소는 그 서비스를 안 쓴다 — `fastapi dev` · `fastapi run` 을 부르는 곳이
    # 코드·스크립트·CI 어디에도 없고(전체 검색 0건), 컨테이너는 uvicorn 을 직접 부른다.
    # sentry 는 import 조차 하지 않는다.
    #
    # **대신 실제로 쓰는 extra 를 직접 적는다.** `[standard]` 가 묶어 주던 것 중
    # 이 저장소가 쓰는 것은 셋뿐이다.
    #   python-multipart  UploadFile — 문서 인식 업로드
    #   email-validator   pydantic EmailStr — 가입·초대
    #   httpx             테스트 AsyncClient (아래에 이미 따로 있다)
    # jinja2 는 뺀다. `TEMPLATE_DIR` 설정은 남아 있지만 `Jinja2Templates` 를 import 하는
    # 곳이 없다 — SPA 는 `app/apis/spa.py` 가 FileResponse 로 낸다.
    "fastapi>=0.128.0",
    "email-validator>=2.2",
    "httpx>=0.28.1",
    "openai>=1.0",
    "python-multipart>=0.0.20",
    # orjson 을 뺐다. 들어와 있던 이유는 `ORJSONResponse` 하나뿐이었는데 FastAPI 가
    # 그걸 deprecate 했고(2026-08-28 마이그레이션), 저장소 어디에서도 직접 import 하지
    # 않는다. 서빙 이미지에 남길 이유가 없다 — 위 `[project] dependencies` 주석의 기준
    # 그대로 "서빙이 실제로 import 하는가"에 걸린다.
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2026.3",
    # **`[standard]` 가 반드시 붙어야 한다.** 예전에는 여기가 맨 `uvicorn` 이었고
    # uvloop·httptools 는 `fastapi[standard]` 를 타고 들어오고 있었다. 위에서 그걸
    # 떼면 uvloop 이 조용히 사라지고 asyncio 기본 루프로 떨어진다 — **테스트는
    # 전부 통과한다.** 성능만 나빠지고 아무 데도 안 찍히는 종류의 회귀라 명시한다.
    "uvicorn[standard]>=0.40.0",
]
dev = [
    "catboost>=1.2",
    "coverage>=7.13.2",
    "fakeredis>=2.26",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
    # 테스트가 `pandas` 와 `export_ensemble` 을 import 한다. 이 한 줄이 있어야
    # CI 가 `uv sync` / `uv sync --group app` 만으로 계속 돈다 — 워크플로를
    # 고치지 않고 도커만 가볍게 하는 것이 이 구조의 요점이다.
    { include-group = "modeling" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# 테스트는 전부 `app/` 아래에 있다. 범위를 안 묶으면 저장소 루트의 일회성 스크립트를
# 테스트로 착각해 import 하고, 그 안의 모듈 레벨 코드가 수집 단계에서 터진다
# (NAVER OCR 탐침이 실제로 그랬다). CI 는 `pytest app` 이라 안 걸렸고 로컬만 죽었다.
testpaths = ["app"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# 세션 스코프 엔진과 루프를 맞추지 않으면 asyncpg가
# "Task got Future attached to a different loop"로 죽는다.
asyncio_default_test_loop_scope = "session"
markers = ["redis: 실제 Redis 서버가 필요한 통합 테스트"]

[tool.ruff]
line-length = 120
target-version = "py310"
# 가져온 코드는 우리 린트 규칙으로 고치지 않는다. 한 글자라도 바꾸면 "팀원의 엔진과
# 비교"가 아니라 "내가 고친 엔진과 비교"가 된다. chronic_disease_engine/PROVENANCE.md 참조.
extend-exclude = ["chronic_disease_engine"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "B", "UP", "N"]
ignore = ["UP046", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# `*` 글롭은 `/`를 넘지 않아 versions/ 아래 생성 파일이 그대로 린트된다.
"app/core/db/migrations/**/*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
exclude = ["app/core/db/migrations/", "chronic_disease_engine/"]

# sklearn·tabpfn 은 py.typed 마커가 없고, schema 는 modeling/data 를 sys.path 에
# 얹어 부르는 지역 모듈이라 mypy 가 경로로 찾지 못한다.
[[tool.mypy.overrides]]
module = ["sklearn.*", "tabpfn.*", "schema"]
ignore_missing_imports = true
